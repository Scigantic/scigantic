[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scigantic"
version = "0.1.0"
description = "Open a public dataset in a browser notebook with the files already mounted, or stream it locally over hf://."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scigantic" }]
keywords = ["datasets", "huggingface", "notebook", "jupyter", "open-data", "science"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.25"]
dev = ["pytest>=7", "huggingface_hub>=0.25"]

[project.scripts]
scigantic = "scigantic.cli:main"

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic"
Documentation = "https://huggingface.co/docs/hub/datasets-scigantic"

[tool.hatch.build.targets.sdist]
include = ["scigantic", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["scigantic"]
