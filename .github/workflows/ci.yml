name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean environment and run the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/scigantic --version
          test "$(/tmp/clean/bin/scigantic open hf:openadmet/cyp-challenge-train-test --no-browser)" = "https://scigantic.com/hf/openadmet/cyp-challenge-train-test"
          /tmp/clean/bin/python -m scigantic open openadmet/cyp-challenge-train-test --no-browser
