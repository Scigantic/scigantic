name: Live API smoke test

# Hits the real scigantic.com API once a day so a server-side change that
# breaks the client contract shows up here, not in a user's terminal.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/test_live.py -m live --no-cov
        env:
          SCIGANTIC_LIVE_TESTS: '1'
